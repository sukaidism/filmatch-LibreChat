# Filmatch CI/CD (SAM10 WS-E stretch): a push to main builds the image, pushes it to ECR,
# publishes config + knowledge + deploy scripts to S3, and redeploys the EC2 instance via SSM.
# AWS access is by OIDC role - there are no AWS keys in GitHub.
#
# Repository settings -> Secrets and variables -> Actions -> Variables:
#   AWS_REGION            e.g. ap-southeast-2
#   AWS_DEPLOY_ROLE_ARN   output GitHubDeployRoleArn of the filmatch-app stack
#   FILMATCH_PROJECT      optional, defaults to "filmatch"

name: Filmatch deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/aws/docs/**'
      - 'deploy/aws/README.md'
  workflow_dispatch:
    inputs:
      skip_build:
        description: Reuse the current image (only republish content/config and redeploy)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: filmatch-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT: ${{ vars.FILMATCH_PROJECT || 'filmatch' }}

jobs:
  build:
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            NODE_MAX_OLD_SPACE_SIZE=6144
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-app:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No `environment:` here - it would change the OIDC subject claim the IAM role trusts.
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish config, knowledge documents and deploy scripts to S3
        run: bash deploy/aws/bin/publish-content.sh

      - name: Point the instance at the new image
        if: ${{ needs.build.result == 'success' }}
        run: |
          aws ssm put-parameter --name "/$PROJECT/app/image-tag" \
            --value "${{ needs.build.outputs.tag }}" --type String --overwrite

      - name: Deploy on EC2 via SSM Run Command
        run: bash deploy/aws/bin/remote.sh deploy
